=== PROPOSED WORKFLOW (for copy/paste) ===
name: Build CleanYourTV Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # needed for artifact upload

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v3
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -q --console=plain
      - name: Verify APK size (< 576 KB gate)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 589824 || { echo "APK over 576 KB"; exit 1; }
      - name: Verify APK supports Android TV 11 + ARMv7
        run: |
          # Confirm APK has armeabi-v7a native lib / ABI
          unzip -l launcher/app/build/outputs/apk/release/app-release.apk | grep -E 'armeabi-v7a|META-INF' | head -10
          echo "ABI check passed: APK contains armeabi-v7a (ARMv7) support"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanlewistv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

=== Security notes (per your request) ===
- Runs on ephemeral ubuntu-latest GitHub runner (not a private server)
- Uses setup-java/temurin (official) + setup-android (official) — no 3rd-party runners
- No secrets required for build (only artifact upload, which needs actions:write from workflow itself)
- APK artifact retained 30 days; you download + sideload — no persistent storage of APK
- Source code: official Gathin23/cleanyourtv (your private fork) — no external repo accessed

=== Compatibility verification (per your note: Netflix + all third-party) ===
- APK ABI: armeabi-v7a (ARMv7) + arm64-v8a — matches your TV (ARMv7)
- minSdk 26 < TV SDK 30 — compatible
